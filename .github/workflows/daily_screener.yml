name: Daily IDX Screener

on:
  schedule:
    # 18:05 WIB (11:05 UTC), Senin–Jumat — setelah bursa tutup & data Yahoo ter-update
    - cron: "5 11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Tulis ulang hasil untuk tanggal bursa yang sama"
        type: boolean
        default: false

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MIN_AVG_VALUE_IDR: ${{ vars.MIN_AVG_VALUE_IDR || '1000000000' }}
      CROSS_LOOKBACK: ${{ vars.CROSS_LOOKBACK || '5' }}
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-screener.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run screener
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m screener.run_screener --force
          else
            python -m screener.run_screener
          fi
      - name: Upload hasil (CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output-${{ github.run_id }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
